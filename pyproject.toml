[project]
name = "dr_tools"
version = "0.0.1"
authors = [{ name = "nigyta", email = "yt@nig.ac.jp" }]
description = "Utility tools for handling DFAST Record JSON and DDBJ MSS Files"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ddbj-record @ git+https://github.com/ddbj/ddbj-record-specifications.git@main",
    "biopython>=1.84",
]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "hypothesis", "mypy", "ruff"]

[project.scripts]
drt_ann2json = "dr_tools.ann2json:main"
drt_json2ann = "dr_tools.json2ann:main"
drt_json2gbk = "dr_tools.json2biopython:json2gbk_main"
drt_json2fasta = "dr_tools.json2fasta:json2fasta_main"
drt_json2stats_for_dfast = "dr_tools.json2stats:json2stats_for_dfast_main"

[project.urls]
"Homepage" = "https://github.com/ddbj/dr_tools"
"Bug Tracker" = "https://github.com/ddbj/dr_tools/issues"

[tool.uv]
package = true

[tool.setuptools.package-data]
dr_tools = ["py.typed"]

[tool.mypy]
files = ["./src/dr_tools/**/*.py", "./tests/**/*.py"]
follow_imports = "silent"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]
# README.md の Python のコードブロックには出力例も書くので、整形しない
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "PL",    # pylint
    "S",     # flake8-bandit
    "T20",   # flake8-print
    "PT",    # flake8-pytest-style
    "PERF",  # perflint
    "FURB",  # refurb
    "PIE",   # flake8-pie
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "FBT",   # flake8-boolean-trap
    "DTZ",   # flake8-datetimez
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "Q",     # flake8-quotes
    "FLY",   # flynt
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "ERA",   # eradicate
    "TID",   # flake8-tidy-imports
    "YTT",   # flake8-2020
    "EXE",   # flake8-executable
]
ignore = [
    "E501",     # 行の長さは ruff format に任せる
    "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917",
    "RET505",
    "FBT001", "FBT002",  # 公開している関数の bool 引数 (json2stats_for_dfast の format_) の形を変えない
    "S101",
    "ISC001",   # ruff format と競合する
    "RUF001", "RUF002", "RUF003",  # 日本語の文字列・docstring・コメントは全角の記号を使う
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004", "S108", "ARG001", "PLC0415",
    "FBT003",  # hypothesis の st.just(True) など
    "FLY002",  # MSS の行を 1 行ずつ並べて join する
]
# CLI の出力と、MSS の show() の表示に print を使う
"src/dr_tools/{MSS,ann2json,json2biopython,json2stats}.py" = ["T201"]
"src/dr_tools/MSS.py" = ["N999"]  # 公開している module の名前を変えない

[tool.ruff.lint.isort]
known-first-party = ["dr_tools"]
